<!DOCTYPE html>
<html>
<head>
    <title>Vasculature Network Viewer</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        <div>Surface Vessels: <span id="surfaceCount">0</span></div>
        <div>Vertical Vessels: <span id="verticalCount">0</span></div>
        <div>Capillaries: <span id="capillaryCount">0</span></div>
        <input type="file" id="fileInput" accept=".json" style="color: white; margin-top: 10px;">
    </div>
    <script async src="https://unpkg.com/es-module-shims/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        let scene, camera, renderer, controls;
        let vesselGroups = {
            surface: new THREE.Group(),
            vertical: new THREE.Group(),
            capillary: new THREE.Group()
        };

        // Initialize scene
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(500, 500, 500);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new TrackballControls(camera, renderer.domElement);
            controls.rotateSpeed = 3.0;
            controls.zoomSpeed = 1.2;
            controls.panSpeed = 0.8;
            controls.noZoom = false;
            controls.noPan = false;
            controls.staticMoving = true;
            controls.dynamicDampingFactor = 0.3;
            controls.keys = ['KeyA', 'KeyS', 'KeyD'];

            // Add vessel groups to scene
            Object.values(vesselGroups).forEach(group => scene.add(group));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            // Add GUI
            setupGUI();

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
        }

        // Create a tube geometry for a vessel
        function createVesselTube(path, radius) {
            const curve = new THREE.CatmullRomCurve3(
                path.map(point => new THREE.Vector3(
                    point[0], 
                    -point[2],  // Negative Y to invert the axis
                    point[1]
                ))
            );
            
            const tubeGeometry = new THREE.TubeGeometry(
                curve,
                path.length * 2, // tubular segments
                radius,         // radius
                8,             // radial segments
                false          // closed
            );
            
            return tubeGeometry;
        }

        // Add this function after init() but before loadVesselData()
        function setupFileInput() {
            const fileInput = document.getElementById('fileInput');
            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const data = JSON.parse(e.target.result);
                        // Clear existing vessels
                        Object.values(vesselGroups).forEach(group => {
                            while(group.children.length > 0) {
                                const mesh = group.children[0];
                                mesh.geometry.dispose();
                                mesh.material.dispose();
                                group.remove(mesh);
                            }
                        });
                        // Load new vessels
                        loadVesselDataFromJson(data);
                    };
                    reader.readAsText(file);
                }
            });
        }

        // Modify the existing loadVesselData function to use this new helper
        async function loadVesselData(url) {
            const response = await fetch(url);
            const data = await response.json();
            loadVesselDataFromJson(data);
        }

        // New helper function that handles the actual vessel creation
        function loadVesselDataFromJson(data) {
            const counts = { surface: 0, vertical: 0, capillary: 0 };

            data.vessels.forEach(vessel => {
                const geometry = createVesselTube(vessel.path, vessel.radius);
                const material = new THREE.MeshPhongMaterial({
                    color: new THREE.Color(...vessel.color),
                    transparent: vessel.type === 'capillary',
                    opacity: vessel.type === 'capillary' ? 0.3 : 1,
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                vesselGroups[vessel.type].add(mesh);
                counts[vessel.type]++;
            });

            // Update vessel counts in UI
            document.getElementById('surfaceCount').textContent = counts.surface;
            document.getElementById('verticalCount').textContent = counts.vertical;
            document.getElementById('capillaryCount').textContent = counts.capillary;

            // Center camera on vessels
            centerCamera();
        }

        function centerCamera() {
            const box = new THREE.Box3();
            box.setFromObject(scene);
            
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            const cameraDistance = Math.abs(maxDim / Math.sin(fov / 2));
            
            camera.position.copy(center);
            camera.position.z += cameraDistance;
            camera.lookAt(center);
            
            // Update TrackballControls target
            controls.target.copy(center);
            controls.update();
        }

        function setupGUI() {
            const gui = new GUI();
            
            const visibilityFolder = gui.addFolder('Visibility');
            Object.entries(vesselGroups).forEach(([key, group]) => {
                visibilityFolder.add(group, 'visible').name(key);
            });
            
            const opacityFolder = gui.addFolder('Opacity');
            Object.entries(vesselGroups).forEach(([key, group]) => {
                opacityFolder
                    .add({ opacity: key === 'capillary' ? 0.3 : 1.0 }, 'opacity', 0, 1)
                    .onChange((value) => {
                        group.children.forEach(child => {
                            child.material.opacity = value;
                            child.material.transparent = value < 1;
                        });
                    })
                    .name(key);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize and start
        init();
        setupFileInput();
        animate();
    </script>
</body>
</html>
