[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calimflow"
version = "0.0.0"
description = "A simulator for calcium imaging dynamics"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Yixian Yang", email = "yixiany2@illinois.edu" },
    { name = "Bo Yuan", email = "boy6@illinois.edu" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-image",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["calimflow"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
